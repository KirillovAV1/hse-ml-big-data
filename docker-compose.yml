services:
  postgres_db:
    image: postgres:17-alpine
    container_name: postgres_hse
    restart: on-failure
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
  
  minio_s3:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: minio_hse
    restart: on-failure
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    volumes:
      - minio_data:/data

  jupyter:
    build: ./jupyter/
    container_name: jupyter_hse
    restart: on-failure
    ports:
      - "8000:8000"
    environment:
      JUPYTER_USER: ${JUPYTER_USER}
      JUPYTER_PASSWORD: ${JUPYTER_PASSWORD}
    command: ["bash", "/init.sh"]


volumes:
  postgres_data:
  minio_data:
